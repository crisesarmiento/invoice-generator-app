name: CI and SonarCloud

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

concurrency:
  group: ci-sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci-sonar:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "20"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm --filter web test

      - name: Build
        run: pnpm build

      - name: Validate SonarCloud settings
        run: |
          test -n "${{ vars.SONAR_ORGANIZATION }}" || { echo "Missing repo variable: SONAR_ORGANIZATION"; exit 1; }
          test -n "${{ vars.SONAR_PROJECT_KEY }}" || { echo "Missing repo variable: SONAR_PROJECT_KEY"; exit 1; }
          test -n "${{ secrets.SONAR_TOKEN }}" || { echo "Missing repo secret: SONAR_TOKEN"; exit 1; }

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            "-Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}"
            "-Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}"
            "-Dsonar.qualitygate.wait=true"
