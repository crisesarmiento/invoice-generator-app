name: Auto Add Items To Project

on:
  issues:
    types:
      - opened
      - reopened
      - transferred
      - labeled
  pull_request_target:
    types:
      - opened
      - reopened
      - labeled

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    env:
      PROJECT_OWNER: crisesarmiento
      PROJECT_NUMBER: "2"
      ROADMAP_LABEL_PREFIXES: "area/,type/,effort/"
      ROADMAP_LABEL_EXACT: "roadmap"
    steps:
      - name: Add issue or PR to project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
          script: |
            const owner = process.env.PROJECT_OWNER;
            const projectNumber = Number(process.env.PROJECT_NUMBER);
            const labelPrefixes = (process.env.ROADMAP_LABEL_PREFIXES || "")
              .split(",")
              .map((value) => value.trim().toLowerCase())
              .filter(Boolean);
            const exactLabels = (process.env.ROADMAP_LABEL_EXACT || "")
              .split(",")
              .map((value) => value.trim().toLowerCase())
              .filter(Boolean);

            const payloadLabels =
              context.payload.issue?.labels ?? context.payload.pull_request?.labels ?? [];
            const labelNames = payloadLabels
              .map((label) => String(label.name || "").toLowerCase())
              .filter(Boolean);

            const hasRoadmapLabel = labelNames.some(
              (name) =>
                exactLabels.includes(name) ||
                labelPrefixes.some((prefix) => name.startsWith(prefix)),
            );

            if (!hasRoadmapLabel) {
              core.info("Skipping: item is not classified as roadmap.");
              return;
            }

            const contentId =
              context.payload.issue?.node_id ??
              context.payload.pull_request?.node_id;

            if (!contentId) {
              core.setFailed("Could not find issue or PR node_id in event payload.");
              return;
            }

            const projectQuery = await github.graphql(
              `
              query ($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                  }
                }
              }
              `,
              { owner, number: projectNumber },
            );

            const projectId = projectQuery.user?.projectV2?.id;
            if (!projectId) {
              core.setFailed(
                `Project not found for ${owner} with number ${projectNumber}.`,
              );
              return;
            }

            try {
              const addResult = await github.graphql(
                `
                mutation ($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(
                    input: { projectId: $projectId, contentId: $contentId }
                  ) {
                    item {
                      id
                    }
                  }
                }
                `,
                { projectId, contentId },
              );

              core.info(
                `Added to project. Item ID: ${addResult.addProjectV2ItemById.item.id}`,
              );
            } catch (error) {
              const message =
                typeof error?.message === "string" ? error.message : String(error);

              if (message.toLowerCase().includes("already exists")) {
                core.info("Item is already in the project. Skipping.");
                return;
              }

              throw error;
            }
