sonar.projectName=Invoice Scope
sonar.sourceEncoding=UTF-8

# Analyze source from the monorepo packages used by the app.
sonar.sources=apps/web/src,packages/db/src
sonar.tests=apps/web/src
sonar.test.inclusions=apps/web/src/**/*.test.ts,apps/web/src/**/*.test.tsx

# Keep generated and third-party files out of analysis.
sonar.exclusions=**/.next/**,**/node_modules/**,**/dist/**,**/coverage/**,**/playwright-report/**,**/test-results/**,**/*.d.ts,**/*.ico

# Coverage gate should focus on test-covered domain/util layers in this monorepo.
sonar.coverage.exclusions=apps/web/src/app/**,apps/web/src/components/**,apps/web/src/actions/**,apps/web/src/lib/pdf/**,apps/web/src/types/**,packages/db/src/**

# Coverage from Vitest (generated in CI before scan).
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
